<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Classic Vinyl Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="opening">

        <video autoplay muted loop id="smooth_criminal">
            <source src="assets/Smooth_Criminal.mp4" type="video/mp4">
        </video>

        <div class="video_overlay"></div>
        <h1>Classic Vinyl Store</h1>

        <div class="hero_container">

            <div class="animation">
                <div class="album">
                    <img src="assets/MJ_ALBUM.JPG" alt="Album Cover" id = "MJ_COVER">
                    <img src="assets/Vinyl.png" alt="Vinyl Disc" id="Vinyl">
                </div>
            </div>

            <div class="song-container">
                <h3>Top Five song in the Vinyl</h3>
                <ul class="song-list">
                    <li class="song-item">
                         <div class="song">
                            <img src="assets/smooth.jpeg" alt="smooth_cover">
                            <h4>Smooth Criminal</h4>
                        </div>
                        <button class="play-btn" data-audio="assets/music/bad.mp3">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                                <path d="M187.2 100.9C174.8 94.1 159.8 94.4 147.6 101.6C135.4 108.8 128 121.9 128 136L128 504C128 518.1 135.5 531.2 147.6 538.4C159.7 545.6 174.8 545.9 187.2 539.1L523.2 355.1C536 348.1 544 334.6 544 320C544 305.4 536 291.9 523.2 284.9L187.2 100.9z"/>
                            </svg>
                        </button>
                    </li>
                    <li class="song-item">
                        <div class="song">
                            <img src="assets/smooth.jpeg" alt="smooth_cover">
                            <h4>Bad</h4>
                        </div>
                        <button class="play-btn" data-audio="assets/music/bad.mp3">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                                <path d="M187.2 100.9C174.8 94.1 159.8 94.4 147.6 101.6C135.4 108.8 128 121.9 128 136L128 504C128 518.1 135.5 531.2 147.6 538.4C159.7 545.6 174.8 545.9 187.2 539.1L523.2 355.1C536 348.1 544 334.6 544 320C544 305.4 536 291.9 523.2 284.9L187.2 100.9z"/>
                            </svg>
                        </button>
                    </li>
                    <li class="song-item">
                        <div class="song">
                            <img src="assets/smooth.jpeg" alt="smooth_cover">
                            <h4>Billie Jeans</h4>
                        </div>
                        <button class="play-btn" data-audio="assets/music/bad.mp3">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                                <path d="M187.2 100.9C174.8 94.1 159.8 94.4 147.6 101.6C135.4 108.8 128 121.9 128 136L128 504C128 518.1 135.5 531.2 147.6 538.4C159.7 545.6 174.8 545.9 187.2 539.1L523.2 355.1C536 348.1 544 334.6 544 320C544 305.4 536 291.9 523.2 284.9L187.2 100.9z"/>
                            </svg>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
        <div class="GSAP-TEXT">Selling Vinyl like Michael Jackson</div>
    </section>
<script type = "module" src="script.js"></script>
</body>
</html>
