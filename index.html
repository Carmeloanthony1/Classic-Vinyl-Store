                    <div class="animation">
                        <div class="album">

                            <img src="assets/Vinyl.png" alt="Vinyl Disc" class="vinyl vinyl_mj">
                        </div>
                    </div>

                    <div class="song-container">
                        <h3>Top three song in the Vinyl</h3>

                                <div class="song">
                                    <img src="assets/smooth.jpeg" alt="smooth_cover">

                                </div>
                                <button class="play-btn" data-audio="assets/music/Smooth.mp3">

                                    <img src="assets/bad.jpeg" alt="smooth_cover">

                                </div>
                                <button class="play-btn" data-audio="assets/music/bad.mp3">

                                </div>
                                <button class="play-btn" data-audio="assets/music/Billie_Jeans.mp3">

                            </li>
